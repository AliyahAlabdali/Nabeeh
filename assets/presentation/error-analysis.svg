<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc"><title id="title">Error analysis: the complete test confusion matrix</title><desc id="desc">Rows are true labels and columns are predicted labels, in the order Legit, Scam. Counts: 450 true legit, 2 false positives, 8 false negatives, 57 true scam. Two legitimate messages were flagged; eight spam-class messages were missed. Spam recall is 0.8769, or 57 of 65 detected. Counts and labels match the original figure.</desc><style>
