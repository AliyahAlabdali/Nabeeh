<svg xmlns="http://www.w3.org/2000/svg" width="360" height="692" viewBox="0 0 360 692" role="img" aria-labelledby="title desc"><title id="title">From SMS text to a class prediction</title><desc id="desc">Notebook example fields are normalized into special tokens; highlighting illustrates preprocessing, not an inference result. Token and learned positional embeddings feed one custom pre-LayerNorm encoder with two attention heads and a 64-to-128-to-64 feed-forward network. Final LayerNorm, masked mean pooling, and a linear classifier produce legit/scam logits.</desc><style>
:root{--ink:#0B101B;--muted:#566178;--paper:#F5F7FB;--card:#FFFFFF;--rule:#D7DEE9;--selected:#FDE7F0;--good:#E8EDF6;--pink:#FF3B8D}
@media(prefers-color-scheme:dark){:root{--ink:#F5F5FA;--muted:#ABB4C8;--paper:#101722;--card:#151E2D;--rule:#354159;--selected:#3C1B2E;--good:#1B293D}}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.pink{fill:var(--pink)}.mono{font-family:Consolas,Menlo,monospace}.rule{stroke:var(--rule)}
</style><rect x="0" y="0" width="360" height="692" rx="14" fill="var(--paper)" stroke="none" stroke-width="1"/><text x="20" y="30" font-size="12" font-weight="600" class="muted" text-anchor="start">MESSAGE → DECISION</text><rect x="20" y="50" width="320" height="144" rx="10" fill="var(--card)" stroke="none" stroke-width="1"/><text x="36" y="75" font-size="11" font-weight="600" class="muted" text-anchor="start">PREPROCESSING EXAMPLE</text><text x="36" y="104" font-size="17" font-weight="600" class="" text-anchor="start">WINNER!! Claim your £900</text><text x="36" y="129" font-size="17" font-weight="600" class="" text-anchor="start">prize now…</text><rect x="36" y="151" width="69" height="26" rx="5" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="70.5" y="169" font-size="13" font-weight="400" class="mono" text-anchor="middle">&lt;curr&gt;</text><rect x="115" y="151" width="65" height="26" rx="5" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="147.5" y="169" font-size="13" font-weight="400" class="mono" text-anchor="middle">&lt;url&gt;</text><rect x="190" y="151" width="83" height="26" rx="5" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="231.5" y="169" font-size="13" font-weight="400" class="mono" text-anchor="middle">&lt;phone&gt;</text><path d="M180 195L180 217" stroke="var(--muted)" stroke-width="1.5"/><path d="M 176 211 L 180 217 L 184 211" fill="none" stroke="var(--muted)" stroke-width="1.5"/><rect x="20" y="227" width="320" height="78" rx="10" fill="var(--card)" stroke="none" stroke-width="1"/><text x="36" y="254" font-size="11" font-weight="600" class="muted" text-anchor="start">TOKEN + POSITION EMBEDDINGS</text><text x="36" y="282" font-size="16" font-weight="400" class="mono" text-anchor="start">64 dimensions · (B, T, 64)</text><path d="M180 306L180 327" stroke="var(--muted)" stroke-width="1.5"/><path d="M 176 321 L 180 327 L 184 321" fill="none" stroke="var(--muted)" stroke-width="1.5"/><rect x="20" y="337" width="320" height="180" rx="10" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="36" y="363" font-size="11" font-weight="600" class="muted" text-anchor="start">CUSTOM PRE-LAYERNORM ENCODER</text><text x="36" y="397" font-size="16" font-weight="600" class="" text-anchor="start">LayerNorm → self-attention</text><text x="36" y="423" font-size="14" font-weight="400" class="muted" text-anchor="start">2 heads · mask · residual</text><path d="M36 438H324" stroke="var(--rule)" stroke-width="1"/><text x="36" y="468" font-size="16" font-weight="600" class="" text-anchor="start">LayerNorm → feed-forward</text><text x="36" y="494" font-size="14" font-weight="400" class="mono muted" text-anchor="start">64 → 128 → 64 · residual</text><path d="M180 518L180 539" stroke="var(--muted)" stroke-width="1.5"/><path d="M 176 533 L 180 539 L 184 533" fill="none" stroke="var(--muted)" stroke-width="1.5"/><rect x="20" y="549" width="320" height="112" rx="10" fill="var(--card)" stroke="none" stroke-width="1"/><text x="36" y="576" font-size="11" font-weight="600" class="muted" text-anchor="start">READOUT</text><text x="36" y="605" font-size="14" font-weight="600" class="" text-anchor="start">Final LayerNorm → masked mean pool</text><text x="36" y="637" font-size="15" font-weight="400" class="mono" text-anchor="start">Linear classifier → legit / scam</text><text x="20" y="683" font-size="11" font-weight="400" class="muted" text-anchor="start">B = batch size · T = sequence length</text></svg>