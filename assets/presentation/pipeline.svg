<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc"><title id="title">From SMS text to a class prediction</title><desc id="desc">Notebook example fields are normalized into special tokens; highlighting illustrates preprocessing, not an inference result. Token and learned positional embeddings feed one custom pre-LayerNorm encoder with two attention heads and a 64-to-128-to-64 feed-forward network. Final LayerNorm, masked mean pooling, and a linear classifier produce legit/scam logits.</desc><style>
:root{--ink:#0B101B;--muted:#566178;--paper:#F5F7FB;--card:#FFFFFF;--rule:#D7DEE9;--selected:#FDE7F0;--good:#E8EDF6;--pink:#FF3B8D}
@media(prefers-color-scheme:dark){:root{--ink:#F5F5FA;--muted:#ABB4C8;--paper:#101722;--card:#151E2D;--rule:#354159;--selected:#3C1B2E;--good:#1B293D}}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.pink{fill:var(--pink)}.mono{font-family:Consolas,Menlo,monospace}.rule{stroke:var(--rule)}
</style><rect x="0" y="0" width="840" height="500" rx="14" fill="var(--paper)" stroke="none" stroke-width="1"/><text x="28" y="34" font-size="12" font-weight="600" class="muted" text-anchor="start">MESSAGE → REPRESENTATION → DECISION</text><rect x="28" y="56" width="784" height="132" rx="10" fill="var(--card)" stroke="none" stroke-width="1"/><text x="48" y="81" font-size="11" font-weight="600" class="muted" text-anchor="start">NOTEBOOK PREPROCESSING EXAMPLE</text><text x="48" y="112" font-size="20" font-weight="600" class="" text-anchor="start">WINNER!! Claim your £900 prize now…</text><text x="48" y="153" font-size="14" font-weight="400" class="mono" text-anchor="start">winner claim your</text><rect x="209" y="134" width="69" height="26" rx="5" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="243.5" y="152" font-size="13" font-weight="400" class="mono" text-anchor="middle">&lt;curr&gt;</text><text x="290" y="153" font-size="14" font-weight="400" class="mono" text-anchor="start">prize now at</text><rect x="411" y="134" width="65" height="26" rx="5" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="443.5" y="152" font-size="13" font-weight="400" class="mono" text-anchor="middle">&lt;url&gt;</text><text x="488" y="153" font-size="14" font-weight="400" class="mono" text-anchor="start">or call</text><rect x="562" y="134" width="83" height="26" rx="5" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="603.5" y="152" font-size="13" font-weight="400" class="mono" text-anchor="middle">&lt;phone&gt;</text><path d="M420 188 V211 H117 V225 M113 219 L117 225 L121 219" fill="none" stroke="var(--muted)" stroke-width="1.5"/><rect x="28" y="233" width="178" height="216" rx="10" fill="var(--card)" stroke="none" stroke-width="1"/><text x="48" y="262" font-size="12" font-weight="600" class="muted" text-anchor="start">EMBED</text><text x="48" y="299" font-size="16" font-weight="600" class="" text-anchor="start">Token + position</text><text x="48" y="326" font-size="15" font-weight="400" class="muted" text-anchor="start">64 dimensions</text><text x="48" y="403" font-size="14" font-weight="400" class="mono muted" text-anchor="start">(B, T, 64)</text><path d="M208 338H235" stroke="var(--muted)" stroke-width="1.5"/><path d="M229 334L235 338L229 342" fill="none" stroke="var(--muted)" stroke-width="1.5"/><rect x="239" y="233" width="332" height="216" rx="10" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="259" y="262" font-size="12" font-weight="600" class="muted" text-anchor="start">CUSTOM ENCODER</text><text x="259" y="299" font-size="16" font-weight="600" class="" text-anchor="start">LayerNorm → self-attention</text><text x="259" y="326" font-size="14" font-weight="400" class="muted" text-anchor="start">2 heads + padding mask + residual</text><path d="M259 345H551" stroke="var(--rule)" stroke-width="1"/><text x="259" y="376" font-size="16" font-weight="600" class="" text-anchor="start">LayerNorm → feed-forward</text><text x="259" y="403" font-size="14" font-weight="400" class="mono muted" text-anchor="start">64 → 128 → 64 + residual</text><path d="M574 338H601" stroke="var(--muted)" stroke-width="1.5"/><path d="M595 334L601 338L595 342" fill="none" stroke="var(--muted)" stroke-width="1.5"/><rect x="605" y="233" width="207" height="216" rx="10" fill="var(--card)" stroke="none" stroke-width="1"/><text x="625" y="262" font-size="12" font-weight="600" class="muted" text-anchor="start">READOUT</text><text x="625" y="299" font-size="15" font-weight="600" class="" text-anchor="start">Final LayerNorm</text><text x="625" y="326" font-size="15" font-weight="400" class="muted" text-anchor="start">Masked mean pool</text><text x="625" y="363" font-size="15" font-weight="600" class="" text-anchor="start">Linear classifier</text><rect x="625" y="383" width="65" height="26" rx="5" fill="var(--good)" stroke="none" stroke-width="1"/><text x="657.5" y="401" font-size="13" font-weight="400" class="mono" text-anchor="middle">legit</text><rect x="701" y="383" width="83" height="26" rx="5" fill="var(--selected)" stroke="none" stroke-width="1"/><text x="742.5" y="401" font-size="13" font-weight="400" class="mono" text-anchor="middle">scam</text><text x="28" y="478" font-size="13" font-weight="400" class="muted" text-anchor="start">B = batch size · T = sequence length · padding is excluded from pooling</text></svg>